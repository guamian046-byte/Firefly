name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://guamian.xyz
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_HOST_KEY"
          test "${SERVER_PORT:-22}" -gt 0

      - name: Test SSH port
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: timeout 10 bash -c "</dev/tcp/$SERVER_HOST/${SERVER_PORT:-22}"

      - name: Test SSH authentication
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" true

      - name: Pull and deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" \
            -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SERVER_USER@$SERVER_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          source_dir="/var/www/guamian/source"
          if [ ! -d "$source_dir/.git" ]; then
            git clone https://github.com/guamian046-byte/Firefly.git "$source_dir"
          fi
          git -C "$source_dir" fetch --depth=1 origin "$revision"
          git -C "$source_dir" checkout --force --detach FETCH_HEAD
          bash "$source_dir/deploy/deploy-from-git.sh"
          REMOTE
