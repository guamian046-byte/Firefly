name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://guamian.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Package release
        run: tar -czf site.tar.gz dist db deploy package.json pnpm-lock.yaml

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts

      - name: Restart current release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" "sudo -n systemctl restart firefly"

      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          timeout 1800 scp -O -v -i ~/.ssh/deploy_key -P "${SERVER_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=6 \
            site.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/guamian-site.tar.gz"

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "tar -xOf /tmp/guamian-site.tar.gz deploy/deploy-guamian > /tmp/deploy-guamian && \
             chmod 755 /tmp/deploy-guamian && \
             sudo -n install -m 755 /tmp/deploy-guamian /usr/local/bin/deploy-guamian && \
             /usr/local/bin/deploy-guamian /tmp/guamian-site.tar.gz && \
             sudo -n systemctl restart firefly"
